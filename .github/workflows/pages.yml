name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout portfolio
        uses: actions/checkout@v4
      - name: Generate downloadable CV from general ML engineering profile
        run: |
          python -m pip install weasyprint==68.0
          weasyprint cv.html Amr_Galal_CV.pdf
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload portfolio files
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Allow Pages artifact to become available
        run: sleep 15
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
